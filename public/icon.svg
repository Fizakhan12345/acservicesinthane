<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005CE6" />
      <stop offset="60%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#00C4FF" />
    </linearGradient>

    <linearGradient id="favSnowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062E3" />
      <stop offset="100%" stop-color="#0095FF" />
    </linearGradient>

    <linearGradient id="favAcBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F2F7FC" />
      <stop offset="100%" stop-color="#D4E4F2" />
    </linearGradient>

    <linearGradient id="favAcCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B4CEE2" />
      <stop offset="100%" stop-color="#E2EEF8" />
    </linearGradient>

    <linearGradient id="favLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <filter id="favShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#061B33" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Arc -->
  <path
    d="M 140 22 C 205 22 258 75 258 140 C 258 152 255 165 248 176 C 242 152 228 130 202 96 C 170 56 125 44 78 54 C 46 61 25 78 16 104 C 12 115 10 127 10 140 C 10 205 63 258 128 260 C 101 260 76 250 56 233 C 27 210 10 173 10 140 C 10 70 68 22 140 22 Z"
