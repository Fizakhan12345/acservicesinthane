<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 270" width="100%" height="100%" fill="none">
  <defs>
    <!-- AC Main Letter Gradient -->
    <linearGradient id="acGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0050D8" />
      <stop offset="45%" stop-color="#0075F6" />
      <stop offset="100%" stop-color="#00BAFF" />
    </linearGradient>

    <!-- Upper Wave Ribbon Gradient -->
    <linearGradient id="waveTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077FF" />
      <stop offset="55%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3CE3FF" />
    </linearGradient>

    <!-- Center Wave Ribbon Gradient -->
    <linearGradient id="waveMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004EC8" />
      <stop offset="50%" stop-color="#008BEB" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <!-- Lower Wave Ribbon Gradient -->
    <linearGradient id="waveBot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003FA8" />
      <stop offset="50%" stop-color="#0066D6" />
      <stop offset="100%" stop-color="#00A6FF" />
    </linearGradient>

    <!-- Dash Bar Gradient -->
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#00B8FF" />
    </linearGradient>
  </defs>

  <!-- 1. AC ICON EMBLEM -->
  <g transform="translate(15, 16)">
    <!-- Letter A -->
    <path
      d="M 72 205 L 14 205 L 90 15 L 138 15 L 214 205 L 156 205 L 140 162 L 88 162 Z M 100 124 L 128 124 L 114 74 Z"
      fill="url(#acGrad)"
    />

    <!-- Letter C Outer & Inner Arc -->
    <path
      d="M 376 72 C 356 36 322 15 275 15 C 204 15 158 66 158 130 C 158 194 204 245 275 245 C 322 245 358 222 380 184 L 326 184 C 312 200 295 210 274 210 C 232 210 210 174 210 130 C 210 86 232 50 274 50 C 295 50 312 60 326 72 Z"
      fill="url(#acGrad)"
    />

    <!-- Wave 1 (Upper Ribbon) -->
    <path
      d="M 210 120 C 238 90 280 88 314 78 C 346 68 380 46 418 50 C 380 62 346 92 314 96 C 278 100 244 98 210 120 Z"
      fill="url(#waveTop)"
    />

    <!-- Wave 2 (Middle Ribbon) -->
    <path
      d="M 214 144 C 246 114 288 114 322 104 C 354 94 392 70 432 74 C 392 86 354 116 322 120 C 286 124 250 122 214 144 Z"
      fill="url(#waveMid)"
    />

    <!-- Wave 3 (Bottom Ribbon) -->
    <path
      d="M 224 168 C 258 138 296 138 330 128 C 362 118 398 96 430 100 C 394 110 362 138 330 142 C 296 146 260 144 224 168 Z"
      fill="url(#waveBot)"
    />
  </g>

  <!-- 2. VERTICAL BLUE SEPARATOR -->
  <line x1="472" y1="32" x2="472" y2="242" stroke="#0099FF" stroke-width="7" stroke-linecap="round" />

  <!-- 3. SERVICES (BOLD UPPERCASE) -->
  <g transform="translate(506, 102)">
    <text
      x="0"
      y="0"
      font-family="'Montserrat', 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="82"
      font-weight="900"
      letter-spacing="5"
      fill="#051937"
    >SERVICES</text>
  </g>

  <!-- 4. — IN THANE — -->
  <g transform="translate(506, 164)">
    <line x1="2" y1="-14" x2="68" y2="-14" stroke="url(#dashGrad)" stroke-width="8" stroke-linecap="round" />
    <text
      x="88"
      y="0"
      font-family="'Montserrat', 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="47"
      font-weight="900"
      letter-spacing="8"
      fill="#0066FF"
    >IN THANE</text>
    <line x1="422" y1="-14" x2="488" y2="-14" stroke="url(#dashGrad)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- 5. SLOGAN: Cool Comfort. Trusted Service. -->
  <g transform="translate(506, 222)">
    <text
      x="0"
      y="0"
      font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="34"
      font-weight="600"
      letter-spacing="0.4"
      fill="#0B203E"
    >Cool Comfort. Trusted Service.</text>
  </g>
</svg>
